# SocChina Web 控制台配置
# 安装后路径：/etc/socchina/web.conf
# 第一版仅包含必要字段；随 W1–W4 阶段扩展。

# HTTP 监听地址（仅 loopback 或受信网络；跨不可信网络时前置 HTTPS 反向代理）
LISTEN_ADDR=:8080

# 静态资源根目录
STATIC_DIR=/usr/share/socchina-web

# Unix socket 路径
APP_CONTROL_SOCK=/run/socchina/app-control.sock
ADMIN_SOCK=/run/socchina/admin.sock

# MediaMTX API（用于聚合媒体会话状态）
MEDIAMTX_API=http://127.0.0.1:9997

# MediaMTX LL-HLS 源（Web 反向代理 /hls/* → MediaMTX）
HLS_ORIGIN=http://127.0.0.1:8888

# SSE 推送间隔（秒）
SSE_INTERVAL_SEC=1
