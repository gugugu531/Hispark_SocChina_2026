# SocChina 板端运行配置。安装脚本只在文件不存在时创建，不覆盖板端已有设置。
CONFIG_VERSION=1
#
# HDMI:
#   0 = 仅启动 RTSP，不初始化 VO/HDMI（默认）
#   1 = RTSP 与 HDMI 同时运行
ENABLE_HDMI=0

# RTSP/H.264
# W0 MediaMTX 模式下建议设置 RTSP_BIND_ADDR=127.0.0.1，RTSP_PORT 改为 8555，STREAM_PATH 改为 internal
# 直接 RTSP 模式（无 MediaMTX）保留 RTSP_BIND_ADDR 为空或注释
RTSP_BIND_ADDR=
RTSP_PORT=8554
STREAM_PATH=live
BITRATE_KBPS=3000

# 相机与规则 Gamma 控制
SENSOR_INDEX=1
CAPTURE_MODE=linear
TARGET_FPS=30
TONE_STRENGTH=0.25

# 低频 NPU 参数网络控制旁路
# 关闭或模型初始化失败时，生产程序自动回退到规则 AE -> Gamma。
ENABLE_NN_CONTROL=1
NN_HIGH_CLIP_GUARD=3.0
MODEL_PATH=/root/socchina-2026/cotf_paramnet_256x144_lcdp_best_e0167_fp16_aipp.om
