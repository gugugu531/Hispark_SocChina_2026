# 静态 AIPP 配置：VPSS chn2 256x144 NV21 → RGB → /255 → NCHW FP16。
# 与 aipp_nv21_1024x576.cfg 使用相同的 BT.601 limited-range CSC、NV21 UV
# 交换和归一化参数，仅输入尺寸改为 Config-R 控制缩略图尺寸。
aipp_op {
related_input_rank: 0
aipp_mode: static
input_format: YUV420SP_U8
src_image_size_w: 256
src_image_size_h: 144
csc_switch: true
rbuv_swap_switch: true
matrix_r0c0: 298
matrix_r0c1: 0
matrix_r0c2: 409
matrix_r1c0: 298
matrix_r1c1: -100
matrix_r1c2: -208
matrix_r2c0: 298
matrix_r2c1: 516
matrix_r2c2: 0
input_bias_0: 16
input_bias_1: 128
input_bias_2: 128
var_reci_chn_0: 0.003921568627
var_reci_chn_1: 0.003921568627
var_reci_chn_2: 0.003921568627
}
