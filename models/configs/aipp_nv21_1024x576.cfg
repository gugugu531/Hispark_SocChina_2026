# 静态 AIPP 配置：NV21(YUV420SP_U8) → RGB → /255 → NCHW FP16。
# 对应 architecture.md §2 第 6 级（AIPP 融入 OM 前端）与 §6 点 2（实测全分辨率 CSC/归一开销）。
#
# 来源：复用 artifacts/zero-dce-svp-nnn/lite-160-aipp/aipp_nv21_rgb_1over255.cfg
#       （板端已验证可用的 NV21→RGB/255 配置），仅把 src_image_size 改到 1024x576。
# CSC：BT.601 limited-range YUV→RGB（input_bias 16/128/128），rbuv_swap=NV21。
# 归一：var_reci = 1/255 ≈ 0.003921568627（把 [0,255] 映射到 [0,1] 归一化域）。
aipp_op {
related_input_rank: 0
aipp_mode: static
input_format: YUV420SP_U8
src_image_size_w: 1024
src_image_size_h: 576
csc_switch: true
rbuv_swap_switch: true
matrix_r0c0: 298
matrix_r0c1: 0
matrix_r0c2: 409
matrix_r1c0: 298
matrix_r1c1: -100
matrix_r1c2: -208
matrix_r2c0: 298
matrix_r2c1: 516
matrix_r2c2: 0
input_bias_0: 16
input_bias_1: 128
input_bias_2: 128
var_reci_chn_0: 0.003921568627
var_reci_chn_1: 0.003921568627
var_reci_chn_2: 0.003921568627
}
