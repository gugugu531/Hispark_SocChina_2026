# CTBG v11: 从头训练 + 抗过拟合配方（无 warm-start）
# v10 warm-start 失败原因：v8 backbone 特征对 18ch 尾过于特化，与 6ch 尾不兼容
seed: 42

# 数据
lol_train: /home/alan/Learning/Retinexformer/data/LOLv1/Train
lol_val:   /home/alan/Learning/Retinexformer/data/LOLv1/Test
sice_root: /home/alan/Learning/Hispark/_eval-lut-curve/data/SICE/Dataset_Part2_512
sice_val_seqs: 20
samples_per_epoch: 500        # 降低复用率
val_samples: 60
patch: 256
p_lol: 0.15
p_identity: 0.3               # 增强恒等约束
batch_size: 8
num_workers: 6
p_nonuniform: 0.3

# 模型(同 v9 6ch)
channels: 12
rep_scale: 4
down: 4

# 损失
tv_w: 0.001
std_w: 0.1
sat_w: 0.1
illum_w: 0.0
b_range: 0.02

# 优化(抗过拟合)
lr: 1.0e-3
max_epochs: 300
precision: 32
save_every_n_epochs: 1
weight_decay: 1.0e-4          # L2 正则
lr_scheduler: cosine_warm_restart
t_0: 40                        # 短周期 LR 重启
t_mult: 1

# 日志
out_dir: /home/alan/Learning/Hispark/_eval-lut-curve/p1_bidir/runs
exp_name: coeff_ctbg_v11
